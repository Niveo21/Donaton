<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="cs-container header-inner">
      <div class="logo" (click)="goTo('/home')">
        <div class="logo-icon bg-gradient-accent shadow-glow">D</div>
        <span class="logo-text">Chile <span class="text-gradient-accent">Donaton</span></span>
      </div>
      <nav class="desktop-nav">
        <a (click)="goTo('/home')">Inicio</a>
        <a (click)="goTo('/emergencias')">Emergencias</a>
        <a (click)="goTo('/voluntarios')">Voluntarios</a>
        <a (click)="goTo('/nosotros')">Nosotros</a>
        <a (click)="goTo('/contacto')">Contacto</a>
      </nav>
      <div class="header-actions">
        <a class="login-link" (click)="goTo('/login')">Iniciar sesión</a>
        <button class="btn-hero" style="padding: 10px 20px; font-size:0.875rem;" (click)="goTo('/registro')">
          Registrarse
        </button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="cs-container page-center">
    <div class="auth-card cs-card">
      <div class="auth-card-header">
        <div class="auth-icon bg-gradient-accent shadow-glow">❤️</div>
        <h1>Bienvenido de vuelta</h1>
        <p class="text-muted">Inicia sesión para continuar ayudando a Chile.</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="cs-label" for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="cs-input"
            placeholder="tu@email.cl"
            [(ngModel)]="email"
            name="email"
          />
        </div>
        <div class="form-group">
          <label class="cs-label" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            class="cs-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
          />
        </div>
        <div class="forgot-link">
          <button type="button" class="text-link">¿Olvidaste tu contraseña?</button>
        </div>
        <button type="submit" class="btn-hero full-width">
          Iniciar sesión
        </button>
      </form>

      <p class="auth-footer">
        ¿No tienes cuenta?
        <a class="text-accent" (click)="goTo('/registro')"> Regístrate aquí</a>
      </p>
    </div>
  </div>
</ion-content>
