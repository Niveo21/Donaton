<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="cs-container page-center">
    <div class="auth-card cs-card">
      <div class="auth-card-header">
        <div class="auth-icon bg-gradient-accent shadow-glow">❤️</div>
        <h1>Bienvenido de vuelta</h1>
        <p class="text-muted">Inicia sesión para continuar ayudando a Chile.</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="cs-label" for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="cs-input"
            placeholder="tu@email.cl"
            [(ngModel)]="email"
            name="email"
          />
        </div>
        <div class="form-group">
          <label class="cs-label" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            class="cs-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
          />
        </div>
        <div class="forgot-link">
          <button type="button" class="text-link">¿Olvidaste tu contraseña?</button>
        </div>
        <button type="submit" class="btn-hero full-width">
          Iniciar sesión
        </button>
      </form>

      <p class="auth-footer">
        ¿No tienes cuenta?
        <a class="text-accent" (click)="goTo('/registro')"> Regístrate aquí</a>
      </p>
    </div>
  </div>
</ion-content>
