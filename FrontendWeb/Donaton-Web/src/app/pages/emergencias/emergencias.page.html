<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="cs-container page-content">
    <span class="section-label">Emergencias</span>
    <h1 class="section-title">Catástrofes activas en Chile</h1>
    <p class="section-subtitle" style="max-width:600px;">
      Estas son las campañas que están recibiendo aportes en este momento.
    </p>

    <div class="cards-grid" style="margin-top:48px;" *ngIf="emergencies.length > 0">
      <div *ngFor="let e of emergencies" class="cs-card emergency-card" [class.urgente-pulse]="e.urgente">
        <div class="card-img-wrap">
          <img [src]="imagenDe(e.tipoEmergencia)" [alt]="e.titulo || e.nombre" loading="lazy" />
          <div class="card-img-overlay"></div>
          <span class="card-region" *ngIf="e.region">📍 {{ e.region }}</span>
          <span class="card-icon-badge">{{ iconoDe(e.tipoEmergencia) }}</span>
        </div>
        <div class="card-body">
          <h3>{{ e.titulo || e.nombre }}</h3>
          <p class="card-desc text-muted">{{ e.descripcion }}</p>
          <button class="btn-primary" (click)="goTo('/donar')">Aportar a esta causa</button>
        </div>
      </div>
    </div>
    <p class="text-muted" style="margin-top:48px;" *ngIf="emergencies.length === 0">
      No hay emergencias activas en este momento.
    </p>
  </div>
</ion-content>
