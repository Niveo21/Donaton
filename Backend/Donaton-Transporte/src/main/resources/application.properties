spring.application.name=Donaton-Transporte


server.port=8086

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/donaton_transport_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=create
