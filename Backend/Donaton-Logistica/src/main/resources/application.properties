spring.application.name=Donaton-Logistica

server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/donaton_logistica_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

#Si vuelve a dar error de almacenamiento cambiar a create y checkear
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8090/eureka}
