spring.application.name=Donaton_Registro

server.port=8084

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/donaton_registro_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8090/eureka}

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8089}
logistica.service.url=${LOGISTICA_URL:http://localhost:8081}
